name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - tools/PrepareRelease.ps1
      - tests/CheckReleasePreparation.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fastfile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check release preparation
        shell: powershell
        run: ./tests/CheckReleasePreparation.ps1
      - name: Configure Release x64
        run: cmake -S . -B build-release -A x64
      - name: Build
        run: cmake --build build-release --config Release --parallel 4
      - name: Run all regression tests
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Build installer and verify payload and process ownership
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./installer/build_installer.ps1 -BuildDirectory build-release/Release
          $version = (Get-Content VERSION -Raw).Trim()
          ./tests/CheckInstallerPayload.ps1 -InstallerPath "dist/FastFile-Setup-$version.exe" -BuildDirectory build-release/Release
          ./tests/CheckInstallerProcessOwnership.ps1 -InstallerPath "dist/FastFile-Setup-$version.exe"
          ./tools/PrepareRelease.ps1
      - name: Preserve verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastFile-Release-x64
          path: |
            dist/FastFile-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query existing releases.' }
          if ($existing.tagName -contains $tag) {
            Write-Host "Release $tag already exists; published assets are preserved."
            exit 0
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query release tag.' }
          if ($remoteTag) { throw "Tag $tag already exists without a release; inspect its commit before publishing." }
          gh release create $tag "dist/FastFile-Setup-$version.exe" dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "FastFile $version（预发布）" --notes-file dist/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
