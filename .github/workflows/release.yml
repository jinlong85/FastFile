name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - tools/PrepareRelease.ps1
      - tests/CheckReleasePreparation.ps1
      - tests/CheckReleaseRuntime.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fastfile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use long temporary paths for native Shell tests
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'FastFileTests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          Write-Host "Native Shell fixtures: $testTemp"
          # ReadProperties tests expect the fixture's full display name. This
          # changes only the disposable runner profile, never the user's PC.
          $advanced = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          New-Item -Path $advanced -Force | Out-Null
          New-ItemProperty -Path $advanced -Name HideFileExt -Value 0 -PropertyType DWord -Force | Out-Null
      - name: Initialize Explorer desktop Shell
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class DesktopShell { [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title); }'
          if ([DesktopShell]::FindWindow('Shell_TrayWnd', $null) -eq [IntPtr]::Zero) {
            Start-Process -FilePath "$env:WINDIR\explorer.exe" -WindowStyle Hidden
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            while ([DesktopShell]::FindWindow('Shell_TrayWnd', $null) -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 250
            }
          }
          Write-Host ('Explorer desktop Shell handle: ' + [DesktopShell]::FindWindow('Shell_TrayWnd', $null))
      - name: Check release preparation
        shell: powershell
        run: ./tests/CheckReleasePreparation.ps1
      - name: Configure Release x64
        run: cmake -S . -B build-release -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build Shell registration preflight
        run: cmake --build build-release --config Release --target FastFileShellWindowTests --parallel 4
      - name: Check cross-process Shell registration
        env:
          FASTFILE_SHELLWINDOW_TRACE: ${{ github.workspace }}\shell-window-trace.log
        run: |
          ctest --test-dir build-release -C Release -R '^FastFileShellWindowTests$' --output-on-failure
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0 -and (Test-Path shell-window-trace.log)) {
            Get-Content shell-window-trace.log -Encoding Unicode -Tail 140
          }
          exit $testExit
      - name: Build
        run: |
          cmake --build build-release --config Release --parallel 4 *> build-output.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-output.log -Tail 150
            exit $LASTEXITCODE
          }
          Write-Host 'Release x64 build succeeded; full compiler output is retained as an artifact.'
      - name: Check native Shell environment
        run: ctest --test-dir build-release -C Release -R 'FastFileExplorerTakeoverLiveTests|FastFileShellBrowserTests' --output-on-failure
      - name: Run all regression tests
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Build installer and verify payload and process ownership
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./installer/build_installer.ps1 -BuildDirectory build-release/Release
          $version = (Get-Content VERSION -Raw).Trim()
          ./tests/CheckInstallerPayload.ps1 -InstallerPath "dist/FastFile-Setup-$version.exe" -BuildDirectory build-release/Release
          ./tests/CheckInstallerProcessOwnership.ps1 -InstallerPath "dist/FastFile-Setup-$version.exe"
          ./tests/CheckReleaseRuntime.ps1 -BuildDirectory build-release/Release
          ./tools/PrepareRelease.ps1
      - name: Preserve verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastFile-Release-x64
          path: |
            dist/FastFile-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $currentHead = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query current main commit.' }
          if ($currentHead -ne $env:GITHUB_SHA) { throw 'This run was superseded; the latest main commit must be verified before publication.' }
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query existing releases.' }
          if ($existing.tagName -contains $tag) {
            Write-Host "Release $tag already exists; published assets are preserved."
            exit 0
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query release tag.' }
          if ($remoteTag) { throw "Tag $tag already exists without a release; inspect its commit before publishing." }
          gh release create $tag "dist/FastFile-Setup-$version.exe" dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "FastFile $version（预发布）" --notes-file dist/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Preserve build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FastFile-Verification-Logs
          path: |
            build-output.log
            shell-window-trace.log
            build-release/Testing/Temporary/*.log
